<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>忘记密码 · 智策（静态演示界面）</title>
    <link rel="stylesheet" href="./screen.css" />
    <link rel="stylesheet" href="./guide-screens.css" />
  </head>
  <body>
    <div class="app login-app">
      <div class="window" style="width: 1080px; height: 680px">
        <div class="window-bar">
          <span>智策</span>
          <span class="dots"><i></i><i></i><i></i></span>
        </div>
        <div class="window-body">
          <!-- 背景只留骨架：文字与弹窗重叠会让这张图读不出信息 -->
          <div class="wizard-card" style="width: 400px; opacity: 0.4">
            <div class="field"><div class="ctl"></div></div>
            <div class="field"><div class="ctl"></div></div>
            <div class="card-actions"><span class="btn" style="width: 100%; justify-content: center">&nbsp;</span></div>
          </div>
        </div>

        <div class="modal-scrim" style="position: absolute">
          <div class="wizard-card" style="width: 440px">
            <h2 style="font-size: 17px">忘记密码？</h2>
            <p class="lede">
              这是你自己的电脑，智策可以直接在这里重置密码，不用打开终端。
            </p>
            <div class="field">
              <label>账号</label>
              <div class="ctl">admin</div>
              <p class="hint">仅当这台机器上只有一个账号、且你是从本机访问时才可以直接重置。</p>
            </div>
            <div class="field">
              <label>新密码</label>
              <div class="ctl is-placeholder">至少 10 位</div>
            </div>
            <div class="field">
              <label>确认新密码</label>
              <div class="ctl is-placeholder">再输入一次</div>
            </div>
            <div class="card-actions">
              <span class="btn">取消</span>
              <span class="btn btn-primary">重置密码</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
