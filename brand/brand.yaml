# OEM 品牌清单 —— 改这份文件，然后 `python scripts/rebrand.py --apply`。
# 只换"显示层"。标识符一律保留（改了会断数据兼容）：
#   Python 包名 octop / src/octop、OCTOP_HOME 与 ~/.octop、.octop 工作区目录、
#   X-Octop-* 请求头、AntD prefixCls="octop"、octop:* localStorage key、
#   侧边栏 19 个 nav key、infra/db/migrations 编号、小写 octop 命令与文件名。

id: zcagent

name:
  en: zcagent          # 非 locale 文件与英文 locale 用这个
  zh: 智策              # zh locale 文件用这个

# 整串替换，先于 token 规则执行（token 规则处理不了的固定说法）
phrases:
  - { from: "Octop 助手", to: "智策助手" }
  - { from: "Octop Assistant", to: "zcagent Assistant" }

identity:
  # 字面量替换（不含大写 Octop，token 规则碰不到）
  literals:
    - { from: "com.tencent.octop", to: "cn.jiuyeke.zcagent" }
    # 上游仓库 slug 出现在安装脚本、镜像标签、"查看更新"链接里；
    # 不写这条，token 规则会把它改成不存在的 TencentCloud/zcagent。
    - { from: "TencentCloud/Octop", to: "openclawzhangchong/zcagent" }
    # 发布产物名前缀（Octop-desktop-*.exe / Octop-portable-*.zip / *.fpk）。
    # token 规则因为要保护 X-Octop-* 这类头名而跳过后接连字符的情况，所以必须
    # 单独列这条：NSIS 的产物名来自 productName（已是 zcagent），生成器与
    # workflow 的 glob 必须一起改，否则上传步骤 if-no-files-found: error。
    # 必须带左边界：`X-Octop-Agent-Id` / `X-Octop-Access-Token` 是**线上协议头**，
    # 对端可能是上游实例或照上游文档写的客户端，纯字面量把它们改成 X-zcagent-* 会
    # 直接断掉云端协同（z01 就这么发出去过，靠 tests/unit/scripts 的转换测试抓回）。
    - pattern: '(?<![A-Za-z0-9_-])Octop-'
      to: "zcagent-"
    # 侧栏「帮助与反馈」指向上游官网（dashboard/src/components/AvatarDropdown.tsx）。
    # 用 pattern 而不是 from：`https://octop.cloud` 是通道服务地址
    # `https://octop.cloud.tencent.com` 的前缀，纯字面量替换会把腾讯的 OctoBot
    # 端点一起改坏。OEM 交付时把 to 换成客户自己的文档/工单入口。
    - pattern: 'https://octop\.cloud(?!\.tencent)'
      to: "https://github.com/openclawzhangchong/zcagent"

colors:
  brand: "#3D5A80"     # 智策默认主色（钢蓝，配牧羊犬的深灰蓝+米白）
  upstream_hex: "#e85d75"  # 上游 rose，用于替换 CSS 兜底色与启动屏；预设色板里的 rose 保留

assets:
  icon: brand/assets/icon-1024.png
  key_background: true    # 抠掉四角采到的实底背景，logo 变透明底

text:
  - glob: src/octop/**/*.py
  - glob: src/octop/i18n/*.json
  # 专家模板与随产品分发的脚本：SOUL.md / SKILL.md 会进系统提示词，
  # offline.html 是断网时用户唯一看得见的页面，install.sh 是运维读的注释。
  # 这些以前不在清扫范围内，`--check` 的守卫也看不见它们（只扫 5 种扩展名）。
  - glob: src/octop/**/*.md
  - glob: src/octop/**/*.sh
  - glob: src/octop/**/*.js
  - glob: src/octop/**/*.json
  - glob: dashboard/index.html
  - glob: dashboard/public/manifest.json
  - glob: dashboard/public/*.html
  - glob: dashboard/src/**/*.{ts,tsx,json,less,css}
  - glob: tests/**/*.py
  - glob: scripts/**/*.{py,sh,ps1,bat,md}
  - glob: desktop/**/*.{go,yml,json,nsi,plist,sh,bat,py,mod,md,txt}
  # 桌面壳自己的 HTML（窗口标题、托盘设置窗、"显示 Octop" 按钮）与 NSIS 的
  # INFO_PRODUCTNAME / COMPANYNAME / COPYRIGHT —— 装完后"应用和功能"里显示的
  # 名称与发行商就来自这里。
  - glob: desktop/**/*.html
  - glob: desktop/**/*.nsh
  - glob: desktop/**/*.manifest
  - glob: fnos/**/*
  - glob: docker/**/*

# 清扫排除项。前两条是"发给外部系统的身份串"，换了对端可能拒绝或归错来源；
# 后两条分别是数据库迁移（永远不动）和前端构建产物（rebuild 会覆盖）。
exclude:
  - scripts/rebrand.py          # 工具自身含品牌正则，扫它会自我改写
  - tests/unit/scripts/**       # 测的就是这套替换规则：输入串必须是**改名之前**的样子，
                                # 扫过去会把 "Welcome to Octop" 和它的期望值一起改掉，
                                # 断言变成恒真（实测被扫过一次，边界测试全绿但已失效）
  - brand/**
  - src/octop/infra/connectors/gateway/adapters/fliggy.py
  - src/octop/infra/connectors/gateway/adapters/qq_mail.py
  - src/octop/infra/db/migrations/**
  - src/octop/dashboard/**
  - .github/**

# 图标产物：源图 → 上游钉死的文件名（文件名不能改，12 处 TSX + vite includeAssets 引用它）
asset_map:
  dashboard/public/pwa-512.png: { size: 512, keep_bg: true }
  dashboard/public/pwa-192.png: { size: 192, keep_bg: true }
  dashboard/public/apple-touch-icon.png: { size: 180, keep_bg: true }
  dashboard/public/favico.svg: { size: 64, svg: true }
  dashboard/public/logo_horizontal_dark.png: { box: [280, 72], lockup: dark }
  dashboard/public/logo_horizontal_white.png: { box: [280, 72], lockup: light }
  dashboard/public/logo_vertical_dark.svg: { size: 128, svg: true }
  dashboard/public/logo_vertical_white.svg: { size: 128, svg: true }

# 吉祥物。OEM 换形象 = 换这三张姿势图，动画由工具生成（代码只用 .webp，.webm 无人引用）
poses:
  - out: dashboard/public/octop-mascot-empty.png
    src: brand/assets/mascot-empty.png
    size: 2048
  - out: dashboard/public/octop-mascot-peek.webp
    src: brand/assets/mascot-peek.png
    box: [352, 320]
    animate: { frames: 30, mode: bob, amplitude: 12, duration: 60 }
  - out: dashboard/public/octop-mascot-type.webp
    src: brand/assets/mascot-typing.png
    box: [856, 812]
    animate: { frames: 24, mode: nod, amplitude: 3, duration: 80 }

# 字标字体（留空则按平台自动找：Windows 雅黑 / macOS 苹方 / Linux Noto CJK）
fonts: {}
